name: Build Percival Flint 3 firmware

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: flint3-percival-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out builder
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo docker image prune --all --force || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3 python3-setuptools python3-pyelftools \
            rsync swig unzip zlib1g-dev file wget libelf-dev dwarves \
            ccache coccinelle zstd

      - name: Validate scripts
        run: |
          bash -n scripts/build.sh scripts/prepare-backports.sh

      - name: Build firmware
        env:
          JOBS: "4"
        run: |
          set -o pipefail
          bash scripts/build.sh 2>&1 | tee build.log

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flint3-percival-firmware
          path: |
            release/flint3-full-factory.bin
            release/flint3-sysupgrade.bin
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub prerelease
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source build.env

          short_sha="${GITHUB_SHA:0:7}"
          tag="flint3-percival-${short_sha}"
          title="Flint 3 Percival firmware (${short_sha})"

          cat > release-notes.md <<NOTES
          Experimental OpenWrt firmware for the GL.iNet Flint 3 (GL-BE9300).

          Built from Percival source commit:
          ${OPENWRT_COMMIT}

          Builder commit:
          ${GITHUB_SHA}

          Included files:
          - flint3-full-factory.bin — factory/recovery installation image
          - flint3-sysupgrade.bin — OpenWrt sysupgrade image
          - SHA256SUMS — integrity checksums

          This is development firmware. Keep a known recovery method available before flashing.
          NOTES

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              release/flint3-full-factory.bin \
              release/flint3-sysupgrade.bin \
              release/SHA256SUMS \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" \
              --title "$title" \
              --notes-file release-notes.md \
              --prerelease \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" \
              release/flint3-full-factory.bin \
              release/flint3-sysupgrade.bin \
              release/SHA256SUMS \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file release-notes.md \
              --prerelease \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flint3-percival-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 14
