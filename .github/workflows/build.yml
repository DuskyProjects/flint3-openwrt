name: Build Flint 3 firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - build.env
      - config.seed
      - packages.required
      - files/**
      - scripts/**
      - .github/workflows/build.yml

permissions:
  contents: read

concurrency:
  group: flint3-firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out builder
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo docker image prune --all --force || true
          df -h

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3 python3-setuptools python3-pyelftools \
            rsync swig unzip zlib1g-dev file wget libelf-dev dwarves \
            jq ca-certificates ccache

      - name: Build and validate factory and sysupgrade images
        env:
          JOBS: '4'
        run: bash scripts/build.sh

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: flint3-openwrt-footstrap
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
