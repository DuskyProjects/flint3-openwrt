name: Track 2 - Build published Percival release

"on":
  workflow_dispatch:
    inputs:
      source_release:
        description: "latest-tested-release or an exact tested-* release tag"
        required: true
        default: "latest-tested-release"
        type: string
      publish_release:
        description: "Publish or update the matching builder prerelease"
        required: true
        default: false
        type: boolean
      force_rebuild:
        description: "Rebuild even when the matching builder release exists"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "37 */6 * * *"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/workflows/percival-tested.yml"
      - "configs/tested-router.seed"
      - "scripts/**"
      - "source.lock"

permissions:
  actions: read
  contents: write

concurrency:
  group: percival-tested-${{ github.event.pull_request.number || 'scheduled' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      release_found: ${{ steps.release.outputs.release_found }}
      publish_release: ${{ steps.request.outputs.publish_release }}
      should_build: ${{ steps.decision.outputs.should_build }}
      source_tag: ${{ steps.release.outputs.source_tag }}
      source_commit: ${{ steps.source.outputs.source_commit }}
      source_short: ${{ steps.source.outputs.source_short }}
      release_tag: ${{ steps.source.outputs.release_tag }}

    steps:
      - name: Check out builder
        uses: actions/checkout@v4

      - name: Select published release policy
        id: request
        env:
          DISPATCH_SOURCE_RELEASE: ${{ inputs.source_release }}
          DISPATCH_PUBLISH_RELEASE: ${{ inputs.publish_release }}
          DISPATCH_FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: |
          set -euo pipefail

          case "$GITHUB_EVENT_NAME" in
            schedule)
              requested_release="latest-tested-release"
              publish_release="true"
              force_rebuild="false"
              ;;
            workflow_dispatch)
              requested_release="${DISPATCH_SOURCE_RELEASE:-latest-tested-release}"
              publish_release="${DISPATCH_PUBLISH_RELEASE:-false}"
              force_rebuild="${DISPATCH_FORCE_REBUILD:-false}"
              ;;
            pull_request)
              requested_release="latest-tested-release"
              publish_release="false"
              force_rebuild="true"
              ;;
            *)
              echo "Unsupported event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac

          {
            printf 'requested_release=%s\n' "$requested_release"
            printf 'publish_release=%s\n' "$publish_release"
            printf 'force_rebuild=%s\n' "$force_rebuild"
          } >> "$GITHUB_OUTPUT"

      - name: Find actual Percival GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE: ${{ steps.request.outputs.requested_release }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source source.lock

          source_tag=""
          if [[ "$REQUESTED_RELEASE" == "latest-tested-release" ]]; then
            source_tag="$(
              gh api "/repos/$OPENWRT_REPOSITORY/releases?per_page=100" \
                --jq '[.[] | select(.draft == false and (.tag_name | startswith("tested-")))] | sort_by(.published_at) | reverse | .[0].tag_name // ""'
            )"
          else
            [[ "$REQUESTED_RELEASE" == tested-* ]]
            if gh api "/repos/$OPENWRT_REPOSITORY/releases/tags/$REQUESTED_RELEASE" \
              > upstream-release.json 2>/dev/null; then
              source_tag="$REQUESTED_RELEASE"
            fi
          fi

          if [[ -z "$source_tag" ]]; then
            cat > release-resolution.txt <<RESOLUTION
          No published, non-draft tested-* GitHub Release currently exists in:
          https://github.com/$OPENWRT_REPOSITORY/releases

          Track 2 is intentionally idle. A tag without a GitHub Release is not
          eligible for this workflow.
          RESOLUTION
            {
              printf 'release_found=false\n'
              printf 'source_tag=\n'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh api "/repos/$OPENWRT_REPOSITORY/releases/tags/$source_tag" \
            > upstream-release.json
          gh api "/repos/$OPENWRT_REPOSITORY/releases/tags/$source_tag" \
            --jq '.body // ""' > upstream-release.md

          release_id="$(
            gh api "/repos/$OPENWRT_REPOSITORY/releases/tags/$source_tag" \
              --jq '.id'
          )"
          published_at="$(
            gh api "/repos/$OPENWRT_REPOSITORY/releases/tags/$source_tag" \
              --jq '.published_at'
          )"
          html_url="$(
            gh api "/repos/$OPENWRT_REPOSITORY/releases/tags/$source_tag" \
              --jq '.html_url'
          )"

          cat > release-resolution.txt <<RESOLUTION
          Upstream repository: $OPENWRT_REPOSITORY
          Upstream release tag: $source_tag
          Upstream release ID: $release_id
          Upstream release published: $published_at
          Upstream release URL: $html_url
          RESOLUTION

          {
            printf 'release_found=true\n'
            printf 'source_tag=%s\n' "$source_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve exact released source tag
        if: steps.release.outputs.release_found == 'true'
        id: source
        env:
          WORK_ROOT: ${{ github.workspace }}/resolve-work
          SOURCE_ENV: ${{ github.workspace }}/resolve-source.env
          TAG_ANNOTATION_FILE: ${{ github.workspace }}/upstream-tag-annotation.md
          SOURCE_TAG: ${{ steps.release.outputs.source_tag }}
        run: |
          set -o pipefail
          bash scripts/resolve-source.sh "$SOURCE_TAG" \
            2>&1 | tee resolve-source.log

      - name: Enforce released-source policy
        if: steps.release.outputs.release_found == 'true'
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source resolve-source.env
          source source.lock

          [[ "$SOURCE_KIND" == tag ]]
          [[ "$SOURCE_TAG" == tested-* ]]
          [[ "$TAG_OBJECT_TYPE" == tag ]]
          test -f upstream-release.json
          test -f upstream-release.md
          [[ "$AP_CONFIG_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$AP_CONFIG_BLOB" =~ ^[0-9a-f]{40}$ ]]
          [[ "$AP_CONFIG_PATH" == configs/ap.config ]]

      - name: Decide whether release needs a build
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_FOUND: ${{ steps.release.outputs.release_found }}
          FORCE_REBUILD: ${{ steps.request.outputs.force_rebuild }}
          PUBLISH_RELEASE: ${{ steps.request.outputs.publish_release }}
          BUILDER_RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
        run: |
          set -euo pipefail
          should_build="false"

          if [[ "$RELEASE_FOUND" == true ]]; then
            should_build="true"
            if [[ "$PUBLISH_RELEASE" == true && "$FORCE_REBUILD" != true ]]; then
              if gh release view "$BUILDER_RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                should_build="false"
                echo "Builder release $BUILDER_RELEASE_TAG already exists."
              fi
            fi
          fi

          printf 'should_build=%s\n' "$should_build" >> "$GITHUB_OUTPUT"

      - name: Upload release-resolution diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PERCIVAL-RELEASE-RESOLUTION-${{ steps.source.outputs.source_short || github.run_id }}
          path: |
            release-resolution.txt
            upstream-release.json
            upstream-release.md
            upstream-tag-annotation.md
            resolve-source.log
            resolve-source.env
            source.lock
          if-no-files-found: warn
          retention-days: 14

  build:
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: tested-router
            slug: router
            config_mode: builder
          - variant: tested-ap
            slug: ap
            config_mode: pinned-ap
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out builder
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo docker image prune --all --force || true
          df -h

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3 python3-setuptools python3-pyelftools \
            rsync swig unzip zlib1g-dev file wget libelf-dev dwarves \
            ccache coccinelle u-boot-tools zstd

      - name: Reconfirm actual upstream release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ needs.resolve.outputs.source_tag }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source source.lock
          gh api "/repos/$OPENWRT_REPOSITORY/releases/tags/$SOURCE_TAG" \
            > "${{ matrix.slug }}-upstream-release.json"

      - name: Resolve exact released source
        env:
          WORK_ROOT: ${{ github.workspace }}/work/${{ matrix.slug }}
          SOURCE_ENV: ${{ github.workspace }}/${{ matrix.slug }}-source.env
          TAG_ANNOTATION_FILE: ${{ github.workspace }}/${{ matrix.slug }}-tag-annotation.md
          SOURCE_TAG: ${{ needs.resolve.outputs.source_tag }}
          EXPECTED_COMMIT: ${{ needs.resolve.outputs.source_commit }}
        run: |
          set -o pipefail
          bash scripts/resolve-source.sh "$SOURCE_TAG" \
            2>&1 | tee "${{ matrix.slug }}-resolve.log"
          # shellcheck disable=SC1090
          source "${{ matrix.slug }}-source.env"
          [[ "$SOURCE_COMMIT" == "$EXPECTED_COMMIT" ]]

      - name: Prepare exact build configuration
        id: config
        env:
          CONFIG_MODE: ${{ matrix.config_mode }}
          OPENWRT_TREE: ${{ github.workspace }}/work/${{ matrix.slug }}/openwrt
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source source.lock

          case "$CONFIG_MODE" in
            builder)
              config_path="$GITHUB_WORKSPACE/configs/tested-router.seed"
              provenance="https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/configs/tested-router.seed"
              config_source_commit="$GITHUB_SHA"
              ;;
            pinned-ap)
              git -C "$OPENWRT_TREE" fetch --depth=1 --no-tags \
                origin "$AP_CONFIG_COMMIT"
              actual_blob="$(
                git -C "$OPENWRT_TREE" rev-parse \
                  "$AP_CONFIG_COMMIT:$AP_CONFIG_PATH"
              )"
              [[ "$actual_blob" == "$AP_CONFIG_BLOB" ]]

              config_path="$GITHUB_WORKSPACE/pinned-ap.config"
              git -C "$OPENWRT_TREE" show \
                "$AP_CONFIG_COMMIT:$AP_CONFIG_PATH" > "$config_path"
              provenance="https://github.com/$OPENWRT_REPOSITORY/blob/$AP_CONFIG_COMMIT/$AP_CONFIG_PATH"
              config_source_commit="$AP_CONFIG_COMMIT"
              ;;
            *)
              echo "Unsupported configuration mode: $CONFIG_MODE" >&2
              exit 1
              ;;
          esac

          test -s "$config_path"
          config_hash="$(sha256sum "$config_path" | awk '{print $1}')"
          {
            printf 'config_path=%s\n' "$config_path"
            printf 'provenance=%s\n' "$provenance"
            printf 'source_commit=%s\n' "$config_source_commit"
            printf 'config_hash=%s\n' "$config_hash"
          } >> "$GITHUB_OUTPUT"

      - name: Restore download cache
        uses: actions/cache/restore@v4
        with:
          path: work/${{ matrix.slug }}/dl
          key: track2-${{ matrix.slug }}-dl-${{ runner.os }}-${{ needs.resolve.outputs.source_commit }}-${{ steps.config.outputs.config_hash }}
          restore-keys: |
            track2-${{ matrix.slug }}-dl-${{ runner.os }}-

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: work/${{ matrix.slug }}/ccache
          key: track2-${{ matrix.slug }}-ccache-${{ runner.os }}-${{ needs.resolve.outputs.source_commit }}-${{ steps.config.outputs.config_hash }}
          restore-keys: |
            track2-${{ matrix.slug }}-ccache-${{ runner.os }}-

      - name: Build published variant
        env:
          BUILD_JOBS: "3"
          DOWNLOAD_JOBS: "4"
          BUILD_VARIANT: ${{ matrix.variant }}
          CONFIG_SOURCE: ${{ steps.config.outputs.config_path }}
          CONFIG_PROVENANCE: ${{ steps.config.outputs.provenance }}
          CONFIG_SOURCE_COMMIT: ${{ steps.config.outputs.source_commit }}
          RELEASE_DIR: ${{ github.workspace }}/release/${{ matrix.slug }}
          WORK_ROOT: ${{ github.workspace }}/work/${{ matrix.slug }}
          SOURCE_ENV: ${{ github.workspace }}/${{ matrix.slug }}-source.env
        run: |
          set -o pipefail
          bash scripts/build-percival.sh \
            2>&1 | tee "${{ matrix.slug }}-build.log"

      - name: Compress successful build log
        if: success()
        run: |
          zstd -f -10 "${{ matrix.slug }}-build.log" \
            -o "release/${{ matrix.slug }}/build.log.zst"

      - name: Save download cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: work/${{ matrix.slug }}/dl
          key: track2-${{ matrix.slug }}-dl-${{ runner.os }}-${{ needs.resolve.outputs.source_commit }}-${{ steps.config.outputs.config_hash }}

      - name: Save compiler cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: work/${{ matrix.slug }}/ccache
          key: track2-${{ matrix.slug }}-ccache-${{ runner.os }}-${{ needs.resolve.outputs.source_commit }}-${{ steps.config.outputs.config_hash }}

      - name: Upload published variant artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RELEASED-${{ needs.resolve.outputs.source_tag }}-${{ matrix.slug }}
          path: release/${{ matrix.slug }}/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RELEASED-${{ matrix.slug }}-FAILURE-${{ github.run_id }}
          path: |
            ${{ matrix.slug }}-upstream-release.json
            ${{ matrix.slug }}-resolve.log
            ${{ matrix.slug }}-source.env
            ${{ matrix.slug }}-build.log
            pinned-ap.config
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs:
      - resolve
      - build
    if: >-
      always() &&
      needs.resolve.outputs.should_build == 'true' &&
      needs.resolve.outputs.publish_release == 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out builder
        uses: actions/checkout@v4

      - name: Reconfirm and fetch upstream release notes
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ needs.resolve.outputs.source_tag }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source source.lock
          gh api "/repos/$OPENWRT_REPOSITORY/releases/tags/$SOURCE_TAG" \
            > upstream-release.json
          gh api "/repos/$OPENWRT_REPOSITORY/releases/tags/$SOURCE_TAG" \
            --jq '.body // ""' > upstream-release.md

      - name: Download released artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: RELEASED-${{ needs.resolve.outputs.source_tag }}-*
          path: downloaded

      - name: Require both released variants
        env:
          SOURCE_TAG: ${{ needs.resolve.outputs.source_tag }}
        run: |
          set -euo pipefail
          test -d "downloaded/RELEASED-$SOURCE_TAG-router"
          test -d "downloaded/RELEASED-$SOURCE_TAG-ap"

      - name: Resolve released tag again
        env:
          WORK_ROOT: ${{ github.workspace }}/publish-work
          SOURCE_ENV: ${{ github.workspace }}/publish-source.env
          TAG_ANNOTATION_FILE: ${{ github.workspace }}/upstream-tag-annotation.md
          SOURCE_TAG: ${{ needs.resolve.outputs.source_tag }}
          EXPECTED_COMMIT: ${{ needs.resolve.outputs.source_commit }}
        run: |
          set -euo pipefail
          bash scripts/resolve-source.sh "$SOURCE_TAG"
          # shellcheck disable=SC1091
          source publish-source.env
          [[ "$SOURCE_COMMIT" == "$EXPECTED_COMMIT" ]]
          [[ "$TAG_OBJECT_TYPE" == tag ]]

      - name: Prepare distinct release assets
        env:
          SOURCE_TAG: ${{ needs.resolve.outputs.source_tag }}
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir -p release-assets

          for artifact_dir in downloaded/RELEASED-"$SOURCE_TAG"-*; do
            [[ -d "$artifact_dir" ]] || continue
            variant="${artifact_dir##*-}"

            while IFS= read -r -d '' source_file; do
              base="$(basename "$source_file")"
              case "$base" in
                *.bin|*.itb)
                  extension="${base##*.}"
                  stem="${base%.*}"
                  destination="release-assets/${stem}-${variant}.${extension}"
                  ;;
                SHA256SUMS)
                  continue
                  ;;
                *)
                  destination="release-assets/${variant}-${base}"
                  ;;
              esac
              install -m 0644 "$source_file" "$destination"
            done < <(find "$artifact_dir" -maxdepth 1 -type f -print0)
          done

          install -m 0644 upstream-release.json \
            release-assets/upstream-release.json
          install -m 0644 upstream-release.md \
            release-assets/upstream-release.md
          install -m 0644 upstream-tag-annotation.md \
            release-assets/upstream-tag-annotation.md

          (
            cd release-assets
            mapfile -t payload < <(
              find . -maxdepth 1 -type f ! -name SHA256SUMS \
                -printf '%f\n' | sort
            )
            (( ${#payload[@]} > 0 ))
            sha256sum "${payload[@]}" > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Publish matching builder prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          SOURCE_TAG: ${{ needs.resolve.outputs.source_tag }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)
          (( ${#assets[@]} > 0 ))
          title="Flint 3 - Percival $SOURCE_TAG"

          if gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" \
              --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" \
              --title "$title" \
              --notes-file upstream-release.md \
              --prerelease \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file upstream-release.md \
              --prerelease \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Mark superseded builder release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          supersedes="$(
            sed -nE 's/^Supersedes:[[:space:]]*//p' \
              upstream-release.md | head -n 1
          )"
          [[ -n "$supersedes" ]] || exit 0

          old_release="percival-$supersedes"
          if ! gh release view "$old_release" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Superseded builder release is not present: $old_release"
            exit 0
          fi

          old_title="$(
            gh release view "$old_release" \
              --repo "$GITHUB_REPOSITORY" \
              --json name --jq .name
          )"
          case "$old_title" in
            '[SUPERSEDED]'*) exit 0 ;;
          esac

          gh release edit "$old_release" \
            --title "[SUPERSEDED] $old_title" \
            --repo "$GITHUB_REPOSITORY"
