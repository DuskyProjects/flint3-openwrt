name: Build merged Flint 3 nightly

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - build.env
      - config.seed
      - packages.required
      - source.required
      - patch-sources.conf
      - patches/**
      - files/**
      - scripts/**
      - .github/workflows/build.yml

permissions:
  contents: write

concurrency:
  group: flint3-merged-nightly
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out builder
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo docker image prune --all --force || true
          df -h

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git gh libncurses-dev \
            libssl-dev python3 python3-setuptools python3-pyelftools \
            rsync swig unzip zlib1g-dev file wget libelf-dev dwarves \
            jq ca-certificates ccache

      - name: Restore OpenWrt download, compiler, and patch-source caches
        id: restore-build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            nightly-work/dl
            nightly-work/ccache
            nightly-work/patch-sources
          key: flint3-build-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            flint3-build-cache-${{ runner.os }}-

      - name: Build or reuse newest known-good firmware
        id: nightly-build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOBS: '4'
          MAX_HISTORY: '3'
          MAX_BUILD_ATTEMPTS: '6'
          CCACHE_MAX_SIZE: '3G'
        run: bash scripts/nightly-or-reuse.sh

      - name: Save updated OpenWrt caches
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            nightly-work/dl
            nightly-work/ccache
            nightly-work/patch-sources
          key: flint3-build-cache-${{ runner.os }}-${{ github.run_id }}

      - name: Stop when no build or reusable release exists
        if: steps.nightly-build.outcome != 'success'
        run: exit 1

      - name: Verify release payload
        run: |
          set -euo pipefail
          source nightly-release.env
          test -s release-notes.md
          test -s "$FACTORY_FILE"
          test -s "$SYSUPGRADE_FILE"
          test "$(find release -maxdepth 1 -type f -name '*.bin' | wc -l)" -eq 2
          test "$(basename "$FACTORY_FILE")" = 'flint3-full-factory.bin'
          test "$(basename "$SYSUPGRADE_FILE")" = 'flint3-sysupgrade.bin'

      - name: Preserve build payload as an Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: flint3-nightly-release-payload-${{ github.run_id }}
          path: |
            release/flint3-full-factory.bin
            release/flint3-sysupgrade.bin
            release-notes.md
            nightly-release.env
          if-no-files-found: error
          retention-days: 14

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source nightly-release.env

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --prerelease

            gh release upload "$RELEASE_TAG" \
              "$FACTORY_FILE" \
              "$SYSUPGRADE_FILE" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$FACTORY_FILE" \
              "$SYSUPGRADE_FILE" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --prerelease
          fi

          while IFS= read -r asset; do
            case "$asset" in
              flint3-full-factory.bin|flint3-sysupgrade.bin) ;;
              *) gh release delete-asset "$RELEASE_TAG" "$asset" --yes ;;
            esac
          done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')

      - name: Verify published release and changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source nightly-release.env

          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort > /tmp/release-assets
          printf '%s\n' \
            'flint3-full-factory.bin' \
            'flint3-sysupgrade.bin' | sort > /tmp/expected-assets
          diff -u /tmp/expected-assets /tmp/release-assets

          test "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')" -eq 2
          test -n "$(gh release view "$RELEASE_TAG" --json body --jq '.body')"
          gh release view "$RELEASE_TAG" --json url --jq '.url'
