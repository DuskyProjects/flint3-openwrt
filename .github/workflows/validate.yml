name: Validate Flint 3 builder

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - validation-trigger.txt

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck python3-yaml

      - name: Validate workflow YAML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          for path in sorted(Path('.github/workflows').glob('*.yml')):
              with path.open('r', encoding='utf-8') as handle:
                  yaml.safe_load(handle)
              print(f'validated {path}')
          PY

      - name: Validate shell scripts and privacy boundary
        run: |
          set -euo pipefail
          bash -n \
            scripts/apply-curated-patches.sh \
            scripts/apply-source-overlays.sh \
            scripts/build.sh \
            scripts/build-local-cachyos.sh \
            scripts/check-mac80211-source.sh \
            scripts/nightly-build.sh \
            scripts/nightly-or-reuse.sh \
            scripts/privacy-audit.sh \
            scripts/refresh-patches.sh \
            scripts/self-test.sh

          shellcheck -S error \
            scripts/apply-curated-patches.sh \
            scripts/apply-source-overlays.sh \
            scripts/build.sh \
            scripts/build-local-cachyos.sh \
            scripts/check-mac80211-source.sh \
            scripts/nightly-build.sh \
            scripts/nightly-or-reuse.sh \
            scripts/privacy-audit.sh \
            scripts/refresh-patches.sh \
            scripts/self-test.sh

          sh -n \
            files/etc/init.d/flint3-pstore \
            files/etc/uci-defaults/90-flint3-generic-defaults \
            files/etc/uci-defaults/99-footstrap-default \
            files/etc/profile.d/50-flint3-country-warning.sh \
            files/usr/bin/flint3-set-country

          bash scripts/privacy-audit.sh

      - name: Run controlled builder self-tests
        run: bash scripts/self-test.sh

      - name: Validate required manifests and safety guards
        run: |
          set -euo pipefail
          test -s packages.required
          test -s source.required
          test -s source-overlays.conf
          test -s patch-sources.conf
          test -s patches/qualcommbe-6.18/0900-usb-dwc3-qcom-flatten-ipq5332-and-select-phy-mux.patch

          grep -Fq 'luci-theme-footstrap' packages.required
          grep -Fq 'kmod-ramoops' packages.required
          grep -Fq 'kmod-zram' packages.required
          grep -Fq 'kakatkar|KakatkarAkshay/openwrt|gl-be9300|required' patch-sources.conf
          grep -Fq 'jhbsz|jhbsz/openwrt-flint3|main|optional' patch-sources.conf
          grep -Fq 'openwrt-main|openwrt/openwrt|main|optional' patch-sources.conf
          grep -Fq 'required|target/linux/qualcommbe/dts/ipq5332-gl-be9300.dts' source-overlays.conf
          grep -Fq 'replace-required|package/kernel/rtl837x/src/rtl837x_common.h' source-overlays.conf
          grep -Fq 'replace-required|package/kernel/rtl837x/src/rtl837x_dsa_ops.c' source-overlays.conf

          grep -Fq 'unset BUILD_VARIANT' scripts/build.sh
          grep -Fq 'FIRMWARE_BUILD_LABEL=' scripts/build.sh
          grep -Fq 'BACKPORTS_BUMP_COMMIT=' scripts/nightly-build.sh
          grep -Fq 'MAX_OVERLAY_HISTORY="${MAX_OVERLAY_HISTORY:-1}"' scripts/nightly-build.sh
          grep -Fq 'scripts/apply-curated-patches.sh' scripts/nightly-build.sh
          grep -Fq 'REFRESH_OPTIONAL_PATCHES=' scripts/nightly-build.sh
          grep -Fq 'REPLACED-REQUIRED' scripts/refresh-patches.sh
          grep -Fq 'Required patch source' scripts/refresh-patches.sh
          grep -Fq 'replace-required' scripts/apply-source-overlays.sh
          grep -Fq 'Any positive status is therefore a content conflict' scripts/apply-source-overlays.sh

          usb_patch='patches/qualcommbe-6.18/0900-usb-dwc3-qcom-flatten-ipq5332-and-select-phy-mux.patch'
          grep -Fq 'drivers/usb/dwc3/dwc3-qcom.c' "$usb_patch"
          grep -Fq 'qcom,ipq5332-dwc3", "qcom,snps-dwc3' "$usb_patch"
          grep -Fq 'usb: usb_dwc: usb@8a00000' "$usb_patch"
          grep -Fq 'reg = <0x08a00000 0x100000>' "$usb_patch"
          grep -Fq 'regmap_write(tcsr, 0x10540, 0x1)' "$usb_patch"
          ! grep -Fq 'dwc3-qcom-legacy.c' "$usb_patch"

          grep -Fq 'workflow_dispatch:' .github/workflows/build.yml
          ! grep -Eq '^  (push|schedule):' .github/workflows/build.yml
          grep -Fq 'cancel-in-progress: false' .github/workflows/build.yml
          grep -Fq 'Nothing was flashed and the router was not rebooted.' scripts/build-local-cachyos.sh
          grep -Fq 'EXPORT_DIR="${EXPORT_DIR:-/mnt/router/flint3-local-build}"' scripts/build-local-cachyos.sh

          if grep -Fq 'git -C "$merged_source" merge' scripts/nightly-build.sh; then
            echo 'Whole-tree OpenWrt merges are prohibited.' >&2
            exit 1
          fi
          test "$(find patches -type f -name '*.patch' | wc -l)" -ge 1
