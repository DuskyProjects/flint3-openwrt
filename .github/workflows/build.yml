name: Build Perceival Flint 3 firmware

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flint3-perceival-build
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out builder
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo docker image prune --all --force || true
          df -h

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git gh curl libncurses-dev \
            libssl-dev python3 python3-setuptools python3-pyelftools \
            rsync swig unzip zlib1g-dev file wget libelf-dev dwarves \
            jq ca-certificates ccache shellcheck python3-yaml

      - name: Validate before compiling
        run: |
          set -euo pipefail
          bash -n \
            scripts/apply-curated-patches.sh \
            scripts/build.sh \
            scripts/build-local-cachyos.sh \
            scripts/check-mac80211-source.sh \
            scripts/nightly-build.sh \
            scripts/nightly-or-reuse.sh \
            scripts/privacy-audit.sh \
            scripts/retain-flint3-ramoops.sh \
            scripts/self-test.sh \
            scripts/test-prepared-source-transfer.sh

          shellcheck -S error \
            scripts/apply-curated-patches.sh \
            scripts/build.sh \
            scripts/build-local-cachyos.sh \
            scripts/check-mac80211-source.sh \
            scripts/nightly-build.sh \
            scripts/nightly-or-reuse.sh \
            scripts/privacy-audit.sh \
            scripts/retain-flint3-ramoops.sh \
            scripts/self-test.sh \
            scripts/test-prepared-source-transfer.sh

          bash scripts/privacy-audit.sh
          bash scripts/self-test.sh
          bash scripts/test-prepared-source-transfer.sh

      - name: Restore OpenWrt download and compiler caches
        id: restore-build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            nightly-work/dl
            nightly-work/ccache
          key: flint3-perceival-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            flint3-perceival-cache-${{ runner.os }}-

      - name: Build or reuse unchanged Perceival firmware
        env:
          GH_TOKEN: ${{ github.token }}
          JOBS: '4'
          CCACHE_MAX_SIZE: '3G'
        run: bash scripts/nightly-or-reuse.sh

      - name: Save updated OpenWrt caches
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            nightly-work/dl
            nightly-work/ccache
          key: flint3-perceival-cache-${{ runner.os }}-${{ github.run_id }}

      - name: Verify release payload
        run: |
          set -euo pipefail
          source nightly-release.env
          test -s release-notes.md
          test -s "$FACTORY_FILE"
          test -s "$SYSUPGRADE_FILE"
          test "$(find release -maxdepth 1 -type f -name '*.bin' | wc -l)" -eq 2
          test "$(basename "$FACTORY_FILE")" = 'flint3-full-factory.bin'
          test "$(basename "$SYSUPGRADE_FILE")" = 'flint3-sysupgrade.bin'

      - name: Preserve build payload as an Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: flint3-release-payload-${{ github.run_id }}
          path: |
            release/flint3-full-factory.bin
            release/flint3-sysupgrade.bin
            release-notes.md
            nightly-release.env
          if-no-files-found: error
          retention-days: 14

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source nightly-release.env

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --prerelease

            gh release upload "$RELEASE_TAG" \
              "$FACTORY_FILE" \
              "$SYSUPGRADE_FILE" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$FACTORY_FILE" \
              "$SYSUPGRADE_FILE" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --prerelease
          fi

          while IFS= read -r asset; do
            case "$asset" in
              flint3-full-factory.bin|flint3-sysupgrade.bin) ;;
              *) gh release delete-asset "$RELEASE_TAG" "$asset" --yes ;;
            esac
          done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')

      - name: Verify published release and changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source nightly-release.env

          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort > /tmp/release-assets
          printf '%s\n' \
            'flint3-full-factory.bin' \
            'flint3-sysupgrade.bin' | sort > /tmp/expected-assets
          diff -u /tmp/expected-assets /tmp/release-assets

          test "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')" -eq 2
          test -n "$(gh release view "$RELEASE_TAG" --json body --jq '.body')"
          gh release view "$RELEASE_TAG" --json url --jq '.url'
