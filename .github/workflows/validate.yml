name: Validate Flint 3 builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck python3-yaml

      - name: Validate workflow YAML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          for path in sorted(Path('.github/workflows').glob('*.yml')):
              with path.open('r', encoding='utf-8') as handle:
                  yaml.safe_load(handle)
              print(f'validated {path}')
          PY

      - name: Validate shell scripts and privacy boundary
        run: |
          set -euo pipefail
          bash -n \
            scripts/apply-curated-patches.sh \
            scripts/build.sh \
            scripts/build-local-cachyos.sh \
            scripts/check-mac80211-source.sh \
            scripts/nightly-build.sh \
            scripts/nightly-or-reuse.sh \
            scripts/prepare-backports-source.sh \
            scripts/privacy-audit.sh \
            scripts/retain-flint3-ramoops.sh \
            scripts/self-test.sh \
            scripts/test-prepared-source-transfer.sh

          shellcheck -S error \
            scripts/apply-curated-patches.sh \
            scripts/build.sh \
            scripts/build-local-cachyos.sh \
            scripts/check-mac80211-source.sh \
            scripts/nightly-build.sh \
            scripts/nightly-or-reuse.sh \
            scripts/prepare-backports-source.sh \
            scripts/privacy-audit.sh \
            scripts/retain-flint3-ramoops.sh \
            scripts/self-test.sh \
            scripts/test-prepared-source-transfer.sh

          sh -n \
            files/etc/init.d/flint3-pstore \
            files/etc/uci-defaults/90-flint3-generic-defaults \
            files/etc/uci-defaults/99-footstrap-default \
            files/etc/profile.d/50-flint3-country-warning.sh \
            files/usr/bin/flint3-set-country

          bash scripts/privacy-audit.sh

      - name: Run controlled builder self-tests
        run: |
          bash scripts/self-test.sh
          bash scripts/test-prepared-source-transfer.sh

      - name: Validate Perceival-only policy and USB patches
        run: |
          set -euo pipefail

          test -s packages.required
          test -s source.required
          test -s scripts/prepare-backports-source.sh
          test -s scripts/retain-flint3-ramoops.sh
          test -s scripts/test-prepared-source-transfer.sh
          test -s patches/qualcommbe-6.18/2989-dt-bindings-usb-qcom-document-multiplexed-phy.patch
          test -s patches/qualcommbe-6.18/2990-usb-dwc3-qcom-flatten-ipq5332-and-select-phy-mux.patch
          test -s patches/openwrt-source/0900-ipq5332-gl-be9300-enable-usb-phy-mux.patch

          test ! -e patch-sources.conf
          test ! -e source-overlays.conf
          test ! -e scripts/apply-source-overlays.sh
          test ! -e scripts/refresh-patches.sh

          grep -Fq 'perceival/openwrt-flint3' build.env
          grep -Fq 'd90c181d96257c58ac370c19bbd640be7d9c0d76' build.env
          grep -Fq 'd90c181d96257c58ac370c19bbd640be7d9c0d76' source.required
          grep -Fq 'openwrt/backports' build.env
          grep -Fq '614e5ed4d40d33cbb99313842a4b4bde264a4b2b' build.env
          grep -Fq '1590cf0329716306e948a8fc29f1d3ee87d3989f' build.env
          grep -Fq 'BACKPORTS_KERNEL_VERSION:=7.2-rc4' build.env
          grep -Fq 'prepare-backports-source.sh' scripts/nightly-build.sh
          grep -Fq -- '--cache "$DOWNLOAD_ROOT"' scripts/nightly-build.sh
          grep -Fq 'no-extra-ath12k-patches' scripts/nightly-build.sh
          grep -Fq 'External overlays: disabled' scripts/nightly-build.sh
          grep -Fq 'External patch intake: disabled' scripts/nightly-build.sh

          for path in \
            scripts/nightly-build.sh \
            scripts/nightly-or-reuse.sh \
            scripts/build-local-cachyos.sh; do
            if grep -Eq 'KakatkarAkshay|OVERLAY_REPOSITORY|CONTROLLED_OVERLAY_COMMIT|patch-sources\.conf|source-overlays\.conf' "$path"; then
              echo "Secondary-source integration reference remains in $path" >&2
              exit 1
            fi
          done

          grep -Fq 'unset BUILD_VARIANT' scripts/build.sh
          grep -Fq 'fetch --no-tags "$OPENWRT_LOCAL_SOURCE" HEAD' scripts/build.sh
          grep -Fq 'toolchain/kernel-headers/compile' scripts/build.sh
          grep -Fq 'target/linux/prepare' scripts/build.sh
          grep -Fq 'target/linux/compile' scripts/build.sh
          grep -Fq 'package/kernel/mac80211/compile' scripts/build.sh
          grep -Fq 'package/kernel/rtl837x/compile' scripts/build.sh
          grep -Fq 'package/network/services/hostapd/compile' scripts/build.sh
          grep -Fq 'Full firmware image build' scripts/build.sh
          ! grep -Fq 'make -j1 V=sc' scripts/build.sh

          binding_patch='patches/qualcommbe-6.18/2989-dt-bindings-usb-qcom-document-multiplexed-phy.patch'
          grep -Fq 'qcom,multiplexed-phy:' "$binding_patch"
          grep -Fq 'type: boolean' "$binding_patch"

          usb_patch='patches/qualcommbe-6.18/2990-usb-dwc3-qcom-flatten-ipq5332-and-select-phy-mux.patch'
          [[ "$(basename "$usb_patch")" > '2030-arm64-dts-qcom-ipq5332-Add-QPIC-SPI-NAND-controller-.patch' ]]
          grep -Fq 'drivers/usb/dwc3/dwc3-qcom.c' "$usb_patch"
          grep -Fq 'qcom,ipq5332-dwc3", "qcom,snps-dwc3' "$usb_patch"
          grep -Fq 'usb: usb_dwc: usb@8a00000' "$usb_patch"
          grep -Fq 'reg = <0x08a00000 0x100000>' "$usb_patch"
          grep -Fq 'of_property_read_bool(dev->of_node, "qcom,multiplexed-phy")' "$usb_patch"
          grep -Fq 'regmap_write(tcsr, 0x10540, 0x1)' "$usb_patch"
          ! grep -Fq 'dwc3-qcom-legacy.c' "$usb_patch"

          board_patch='patches/openwrt-source/0900-ipq5332-gl-be9300-enable-usb-phy-mux.patch'
          grep -Fq '&usb {' "$board_patch"
          grep -Fq 'qcom,multiplexed-phy;' "$board_patch"
          ! grep -Fq 'qcom,phy-mux-regs' "$board_patch"

          grep -Fq 'workflow_dispatch:' .github/workflows/build.yml
          grep -Fq '  push:' .github/workflows/build.yml
          grep -Fq '      - main' .github/workflows/build.yml
          grep -Fq '      - build-trigger.txt' .github/workflows/build.yml
          ! grep -Fq 'schedule:' .github/workflows/build.yml
          grep -Fq 'cancel-in-progress: true' .github/workflows/build.yml
          grep -Fq 'Nothing was flashed and the router was not rebooted.' scripts/build-local-cachyos.sh
          grep -Fq 'EXPORT_DIR="${EXPORT_DIR:-/mnt/router/flint3-local-build}"' scripts/build-local-cachyos.sh

          test "$(find patches -type f -name '*.patch' | wc -l)" -ge 1
