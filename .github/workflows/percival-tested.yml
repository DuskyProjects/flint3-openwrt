name: Track 2 - Build tested Percival release

"on":
  workflow_dispatch:
    inputs:
      source_ref:
        description: "latest-tested or an exact tested-* tag"
        required: true
        default: "latest-tested"
        type: string
      publish_release:
        description: "Publish or update the tested-tag prerelease"
        required: true
        default: false
        type: boolean
      force_rebuild:
        description: "Rebuild even when the matching release exists"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "37 */6 * * *"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/workflows/percival-tested.yml"
      - "configs/tested-router.seed"
      - "scripts/**"
      - "source.lock"

permissions:
  actions: read
  contents: write

concurrency:
  group: percival-tested-${{ github.event.pull_request.number || 'scheduled' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      requested_ref: ${{ steps.request.outputs.requested_ref }}
      publish_release: ${{ steps.request.outputs.publish_release }}
      force_rebuild: ${{ steps.request.outputs.force_rebuild }}
      should_build: ${{ steps.decision.outputs.should_build }}
      source_tag: ${{ steps.source.outputs.source_tag }}
      source_commit: ${{ steps.source.outputs.source_commit }}
      source_short: ${{ steps.source.outputs.source_short }}
      release_tag: ${{ steps.source.outputs.release_tag }}
      has_ap_config: ${{ steps.source.outputs.has_ap_config }}

    steps:
      - name: Check out builder
        uses: actions/checkout@v4

      - name: Select tested source policy
        id: request
        env:
          DISPATCH_SOURCE_REF: ${{ inputs.source_ref }}
          DISPATCH_PUBLISH_RELEASE: ${{ inputs.publish_release }}
          DISPATCH_FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: |
          set -euo pipefail

          case "$GITHUB_EVENT_NAME" in
            schedule)
              requested_ref="latest-tested"
              publish_release="true"
              force_rebuild="false"
              ;;
            workflow_dispatch)
              requested_ref="${DISPATCH_SOURCE_REF:-latest-tested}"
              publish_release="${DISPATCH_PUBLISH_RELEASE:-false}"
              force_rebuild="${DISPATCH_FORCE_REBUILD:-false}"
              ;;
            pull_request)
              requested_ref="latest-tested"
              publish_release="false"
              force_rebuild="true"
              ;;
            *)
              echo "Unsupported event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac

          {
            printf 'requested_ref=%s\n' "$requested_ref"
            printf 'publish_release=%s\n' "$publish_release"
            printf 'force_rebuild=%s\n' "$force_rebuild"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve annotated tested tag
        id: source
        env:
          WORK_ROOT: ${{ github.workspace }}/resolve-work
          SOURCE_ENV: ${{ github.workspace }}/resolve-source.env
          TAG_ANNOTATION_FILE: ${{ github.workspace }}/upstream-tag-annotation.md
          REQUESTED_REF: ${{ steps.request.outputs.requested_ref }}
        run: |
          set -o pipefail
          bash scripts/resolve-source.sh "$REQUESTED_REF" \
            2>&1 | tee resolve-source.log

          if [[ "${{ steps.source.outputs.source_kind }}" != "tag" ]]; then
            echo "Track 2 accepts only tested-* tags." >&2
            exit 1
          fi

      - name: Enforce tested tag naming
        env:
          SOURCE_TAG: ${{ steps.source.outputs.source_tag }}
          TAG_OBJECT_TYPE: ${{ steps.source.outputs.tag_object_type }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_TAG" == tested-* ]]
          [[ "$TAG_OBJECT_TYPE" == tag ]]
          test -s upstream-tag-annotation.md

      - name: Decide whether tested release needs a build
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_REBUILD: ${{ steps.request.outputs.force_rebuild }}
          PUBLISH_RELEASE: ${{ steps.request.outputs.publish_release }}
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
        run: |
          set -euo pipefail
          should_build="true"

          if [[ "$PUBLISH_RELEASE" == "true" && "$FORCE_REBUILD" != "true" ]]; then
            if gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              should_build="false"
              echo "Release $RELEASE_TAG already exists; no rebuild is needed."
            fi
          fi

          printf 'should_build=%s\n' "$should_build" >> "$GITHUB_OUTPUT"

      - name: Upload resolution diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TESTED-RESOLUTION-${{ steps.source.outputs.source_short || github.run_id }}
          path: |
            resolve-source.log
            resolve-source.env
            upstream-tag-annotation.md
          if-no-files-found: warn
          retention-days: 14

  build-router:
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out builder
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo docker image prune --all --force || true
          df -h

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3 python3-setuptools python3-pyelftools \
            rsync swig unzip zlib1g-dev file wget libelf-dev dwarves \
            ccache coccinelle u-boot-tools zstd

      - name: Resolve exact tested source
        env:
          WORK_ROOT: ${{ github.workspace }}/work/router
          SOURCE_ENV: ${{ github.workspace }}/router-source.env
          TAG_ANNOTATION_FILE: ${{ github.workspace }}/router-tag-annotation.md
          SOURCE_TAG: ${{ needs.resolve.outputs.source_tag }}
          EXPECTED_COMMIT: ${{ needs.resolve.outputs.source_commit }}
        run: |
          set -o pipefail
          bash scripts/resolve-source.sh "$SOURCE_TAG" \
            2>&1 | tee router-resolve.log
          # shellcheck disable=SC1091
          source router-source.env
          [[ "$SOURCE_COMMIT" == "$EXPECTED_COMMIT" ]]

      - name: Restore router download cache
        uses: actions/cache/restore@v4
        with:
          path: work/router/dl
          key: track2-router-dl-${{ runner.os }}-${{ needs.resolve.outputs.source_commit }}-${{ hashFiles('configs/tested-router.seed') }}
          restore-keys: |
            track2-router-dl-${{ runner.os }}-

      - name: Restore router compiler cache
        uses: actions/cache/restore@v4
        with:
          path: work/router/ccache
          key: track2-router-ccache-${{ runner.os }}-${{ needs.resolve.outputs.source_commit }}-${{ hashFiles('configs/tested-router.seed') }}
          restore-keys: |
            track2-router-ccache-${{ runner.os }}-

      - name: Build tested router variant
        env:
          BUILD_JOBS: "3"
          DOWNLOAD_JOBS: "4"
          BUILD_VARIANT: tested-router
          CONFIG_SOURCE: ${{ github.workspace }}/configs/tested-router.seed
          RELEASE_DIR: ${{ github.workspace }}/release/router
          WORK_ROOT: ${{ github.workspace }}/work/router
          SOURCE_ENV: ${{ github.workspace }}/router-source.env
        run: |
          set -o pipefail
          bash scripts/build-percival.sh 2>&1 | tee router-build.log

      - name: Compress router build log
        if: success()
        run: zstd -f -10 router-build.log -o release/router/build.log.zst

      - name: Save router caches
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            work/router/dl
            work/router/ccache
          key: track2-router-combined-${{ runner.os }}-${{ needs.resolve.outputs.source_commit }}-${{ hashFiles('configs/tested-router.seed') }}

      - name: Upload tested router artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TESTED-${{ needs.resolve.outputs.source_tag }}-router
          path: release/router/
          if-no-files-found: error
          retention-days: 30

      - name: Upload router failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TESTED-ROUTER-FAILURE-${{ github.run_id }}
          path: |
            router-resolve.log
            router-source.env
            router-build.log
          if-no-files-found: warn
          retention-days: 14

  build-ap:
    needs: resolve
    if: >-
      needs.resolve.outputs.should_build == 'true' &&
      needs.resolve.outputs.has_ap_config == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out builder
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo docker image prune --all --force || true
          df -h

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3 python3-setuptools python3-pyelftools \
            rsync swig unzip zlib1g-dev file wget libelf-dev dwarves \
            ccache coccinelle u-boot-tools zstd

      - name: Resolve exact tested source
        env:
          WORK_ROOT: ${{ github.workspace }}/work/ap
          SOURCE_ENV: ${{ github.workspace }}/ap-source.env
          TAG_ANNOTATION_FILE: ${{ github.workspace }}/ap-tag-annotation.md
          SOURCE_TAG: ${{ needs.resolve.outputs.source_tag }}
          EXPECTED_COMMIT: ${{ needs.resolve.outputs.source_commit }}
        run: |
          set -o pipefail
          bash scripts/resolve-source.sh "$SOURCE_TAG" \
            2>&1 | tee ap-resolve.log
          # shellcheck disable=SC1091
          source ap-source.env
          [[ "$SOURCE_COMMIT" == "$EXPECTED_COMMIT" ]]
          test -s work/ap/openwrt/configs/ap.config

      - name: Restore AP download cache
        uses: actions/cache/restore@v4
        with:
          path: work/ap/dl
          key: track2-ap-dl-${{ runner.os }}-${{ needs.resolve.outputs.source_commit }}
          restore-keys: |
            track2-ap-dl-${{ runner.os }}-

      - name: Restore AP compiler cache
        uses: actions/cache/restore@v4
        with:
          path: work/ap/ccache
          key: track2-ap-ccache-${{ runner.os }}-${{ needs.resolve.outputs.source_commit }}
          restore-keys: |
            track2-ap-ccache-${{ runner.os }}-

      - name: Build Percival sanitized AP variant
        env:
          BUILD_JOBS: "3"
          DOWNLOAD_JOBS: "4"
          BUILD_VARIANT: tested-ap
          CONFIG_SOURCE: upstream:configs/ap.config
          RELEASE_DIR: ${{ github.workspace }}/release/ap
          WORK_ROOT: ${{ github.workspace }}/work/ap
          SOURCE_ENV: ${{ github.workspace }}/ap-source.env
        run: |
          set -o pipefail
          bash scripts/build-percival.sh 2>&1 | tee ap-build.log

      - name: Compress AP build log
        if: success()
        run: zstd -f -10 ap-build.log -o release/ap/build.log.zst

      - name: Save AP caches
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            work/ap/dl
            work/ap/ccache
          key: track2-ap-combined-${{ runner.os }}-${{ needs.resolve.outputs.source_commit }}

      - name: Upload tested AP artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TESTED-${{ needs.resolve.outputs.source_tag }}-ap
          path: release/ap/
          if-no-files-found: error
          retention-days: 30

      - name: Upload AP failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TESTED-AP-FAILURE-${{ github.run_id }}
          path: |
            ap-resolve.log
            ap-source.env
            ap-build.log
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs:
      - resolve
      - build-router
      - build-ap
    if: >-
      always() &&
      needs.resolve.outputs.should_build == 'true' &&
      needs.resolve.outputs.publish_release == 'true' &&
      needs.build-router.result == 'success' &&
      (needs.build-ap.result == 'success' || needs.build-ap.result == 'skipped')
    runs-on: ubuntu-24.04

    steps:
      - name: Check out builder
        uses: actions/checkout@v4

      - name: Download router artifact
        uses: actions/download-artifact@v4
        with:
          name: TESTED-${{ needs.resolve.outputs.source_tag }}-router
          path: downloaded/router

      - name: Download AP artifact
        if: needs.resolve.outputs.has_ap_config == 'true'
        uses: actions/download-artifact@v4
        with:
          name: TESTED-${{ needs.resolve.outputs.source_tag }}-ap
          path: downloaded/ap

      - name: Resolve tag annotation again
        env:
          WORK_ROOT: ${{ github.workspace }}/publish-work
          SOURCE_ENV: ${{ github.workspace }}/publish-source.env
          TAG_ANNOTATION_FILE: ${{ github.workspace }}/upstream-tag-annotation.md
          SOURCE_TAG: ${{ needs.resolve.outputs.source_tag }}
          EXPECTED_COMMIT: ${{ needs.resolve.outputs.source_commit }}
        run: |
          set -euo pipefail
          bash scripts/resolve-source.sh "$SOURCE_TAG"
          # shellcheck disable=SC1091
          source publish-source.env
          [[ "$SOURCE_COMMIT" == "$EXPECTED_COMMIT" ]]
          [[ "$TAG_OBJECT_TYPE" == tag ]]
          test -s upstream-tag-annotation.md

      - name: Prepare distinct release assets
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir -p release-assets

          copy_variant() {
            local source_dir="$1"
            local variant="$2"
            local source_file base stem extension destination

            while IFS= read -r -d '' source_file; do
              base="$(basename "$source_file")"
              case "$base" in
                *.bin|*.itb)
                  extension="${base##*.}"
                  stem="${base%.*}"
                  destination="release-assets/${stem}-${variant}.${extension}"
                  ;;
                SHA256SUMS)
                  continue
                  ;;
                *)
                  destination="release-assets/${variant}-${base}"
                  ;;
              esac
              install -m 0644 "$source_file" "$destination"
            done < <(find "$source_dir" -maxdepth 1 -type f -print0)
          }

          copy_variant downloaded/router router
          if [[ -d downloaded/ap ]]; then
            copy_variant downloaded/ap ap
          fi

          install -m 0644 upstream-tag-annotation.md \
            release-assets/upstream-tag-annotation.md

          (
            cd release-assets
            mapfile -t payload < <(
              find . -maxdepth 1 -type f ! -name SHA256SUMS \
                -printf '%f\n' | sort
            )
            sha256sum "${payload[@]}" > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Publish tested-tag prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          SOURCE_TAG: ${{ needs.resolve.outputs.source_tag }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)
          (( ${#assets[@]} > 0 ))
          title="Flint 3 - Percival $SOURCE_TAG"

          if gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" \
              --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" \
              --title "$title" \
              --notes-file upstream-tag-annotation.md \
              --prerelease \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file upstream-tag-annotation.md \
              --prerelease \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Mark superseded tested release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          supersedes="$(
            sed -nE 's/^Supersedes:[[:space:]]*//p' \
              upstream-tag-annotation.md | head -n 1
          )"
          [[ -n "$supersedes" ]] || exit 0

          old_release="percival-$supersedes"
          if ! gh release view "$old_release" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Superseded release does not exist in this repository: $old_release"
            exit 0
          fi

          old_title="$(
            gh release view "$old_release" \
              --repo "$GITHUB_REPOSITORY" \
              --json name --jq .name
          )"
          case "$old_title" in
            '[SUPERSEDED]'*) exit 0 ;;
          esac

          gh release edit "$old_release" \
            --title "[SUPERSEDED] $old_title" \
            --repo "$GITHUB_REPOSITORY"
