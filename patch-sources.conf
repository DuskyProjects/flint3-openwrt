# Patch-intake sources.
# Format: id|repository|branch|policy
#
# Required sources are always integrated as a coherent patch series. Existing
# patches at the same path are replaced by the required source revision when
# their patch IDs differ.
#
# The controlled pre-release build intentionally disables optional external
# patch feeds. OpenWrt main supplied a second differently named copy of the
# RTL8365MB 942-05..942-09 backport series already present in the selected
# Perceival tree, causing kernel-header preparation to apply the same series
# twice. Re-enable optional intake only after a complete firmware build passes
# and optional patches are filtered against the selected kernel patch stack.

kakatkar|KakatkarAkshay/openwrt|gl-be9300|required
