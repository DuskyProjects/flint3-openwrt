name: Build merged Flint 3 nightly

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - build.env
      - config.seed
      - packages.required
      - source.required
      - patches/**
      - files/**
      - scripts/**
      - .github/workflows/build.yml

permissions:
  contents: write

concurrency:
  group: flint3-merged-nightly
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out builder
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo docker image prune --all --force || true
          df -h

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3 python3-setuptools python3-pyelftools \
            rsync swig unzip zlib1g-dev file wget libelf-dev dwarves \
            jq ca-certificates ccache

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: nightly-work/ccache
          key: flint3-ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            flint3-ccache-${{ runner.os }}-

      - name: Apply merged-source conflict policy
        run: |
          set -euo pipefail

          # Perceival remains the base because it carries the validated factory
          # and stock-restore path. Where both trees edit the same lines, use
          # Kakatkar's newer hardware/driver hunk instead of rejecting every
          # candidate before compilation. Non-conflicting changes from both
          # histories remain in the merged tree.
          sed -i \
            's/merge --no-ff --no-edit --no-gpg-sign FETCH_HEAD/merge --strategy=ort -X theirs --no-ff --no-edit --no-gpg-sign FETCH_HEAD/' \
            scripts/nightly-build.sh

          sed -i \
            's/merged cleanly, passed the privacy and package checks/merged with the Kakatkar-preferred overlapping-hunk policy, passed the privacy and package checks/' \
            scripts/nightly-build.sh

          grep -Fq 'merge --strategy=ort -X theirs --no-ff' scripts/nightly-build.sh

      - name: Select and build newest working merged candidate
        env:
          JOBS: '4'
          MAX_HISTORY: '3'
          MAX_BUILD_ATTEMPTS: '4'
        run: bash scripts/nightly-build.sh

      - name: Publish exactly two firmware assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source nightly-release.env

          test -f "$FACTORY_FILE"
          test -f "$SYSUPGRADE_FILE"
          test "$(find release -maxdepth 1 -type f -name '*.bin' | wc -l)" -eq 2

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --prerelease

            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --prerelease
          fi

          gh release upload "$RELEASE_TAG" \
            "$FACTORY_FILE" \
            "$SYSUPGRADE_FILE" \
            --clobber

          asset_count="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')"
          test "$asset_count" -eq 2

          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort > /tmp/release-assets
          printf '%s\n' \
            "$(basename "$FACTORY_FILE")" \
            "$(basename "$SYSUPGRADE_FILE")" | sort > /tmp/expected-assets
          diff -u /tmp/expected-assets /tmp/release-assets
