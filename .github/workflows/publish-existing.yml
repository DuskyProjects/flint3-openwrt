name: Publish latest successful Flint 3 firmware

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-existing.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04

    steps:
      - name: Publish newest successful firmware artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow build.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"

          if [[ -z "$run_id" || "$run_id" == "null" ]]; then
            echo "No successful build.yml run was found." >&2
            exit 1
          fi

          source_sha="$(gh run view "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --json headSha \
            --jq '.headSha')"
          short_sha="${source_sha:0:7}"
          tag="flint3-percival-${short_sha}"
          title="Flint 3 Percival firmware (${short_sha})"

          rm -rf downloaded
          mkdir -p downloaded
          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name flint3-percival-firmware \
            --dir downloaded

          factory="$(find downloaded -type f -name 'flint3-full-factory.bin' -print -quit)"
          sysupgrade="$(find downloaded -type f -name 'flint3-sysupgrade.bin' -print -quit)"
          checksums="$(find downloaded -type f -name 'SHA256SUMS' -print -quit)"

          test -s "$factory"
          test -s "$sysupgrade"
          test -s "$checksums"

          cat > release-notes.md <<NOTES
          Experimental OpenWrt firmware for the GL.iNet Flint 3 (GL-BE9300).

          Published from successful Actions run ${run_id}.
          Firmware builder commit: ${source_sha}
          Release publisher commit: ${GITHUB_SHA}

          Included files:
          - flint3-full-factory.bin — factory/recovery installation image
          - flint3-sysupgrade.bin — OpenWrt sysupgrade image
          - SHA256SUMS — integrity checksums

          This is development firmware. Keep a known recovery method available before flashing.
          NOTES

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              "$factory" "$sysupgrade" "$checksums" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" \
              --title "$title" \
              --notes-file release-notes.md \
              --prerelease \
              --repo "$GITHUB_REPOSITORY"
          else
            # Anchor the release tag to current main. GitHub's built-in
            # GITHUB_TOKEN cannot create a release targeting an older commit
            # that differs from main under .github/workflows. The binaries and
            # notes still identify the exact successful firmware build commit.
            gh release create "$tag" \
              "$factory" "$sysupgrade" "$checksums" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file release-notes.md \
              --prerelease \
              --repo "$GITHUB_REPOSITORY"
          fi
