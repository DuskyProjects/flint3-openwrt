name: Build merged Flint 3 nightly

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flint3-merged-nightly
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out builder
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo docker image prune --all --force || true
          df -h

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3 python3-setuptools python3-pyelftools \
            rsync swig unzip zlib1g-dev file wget libelf-dev dwarves \
            jq ca-certificates ccache

      - name: Restore OpenWrt download and compiler caches
        id: restore-build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            nightly-work/dl
            nightly-work/ccache
          key: flint3-build-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            flint3-build-cache-${{ runner.os }}-

      - name: Apply merged-source conflict policy
        run: |
          set -euo pipefail

          # Perceival remains the factory/restore base. Kakatkar's version wins
          # only where the two histories edit the same hunk; all nonconflicting
          # changes from both trees remain in the candidate.
          sed -i \
            's/merge --no-ff --no-edit --no-gpg-sign FETCH_HEAD/merge --strategy=ort -X theirs --no-ff --no-edit --no-gpg-sign FETCH_HEAD/' \
            scripts/nightly-build.sh

          sed -i \
            's/merged cleanly, passed the privacy and package checks/merged with the Kakatkar-preferred overlapping-hunk policy, passed the privacy and package checks/' \
            scripts/nightly-build.sh

          grep -Fq 'merge --strategy=ort -X theirs --no-ff' scripts/nightly-build.sh

      - name: Build or reuse newest known-good firmware
        id: nightly-build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOBS: '4'
          MAX_HISTORY: '3'
          MAX_BUILD_ATTEMPTS: '4'
          CCACHE_MAX_SIZE: '3G'
        run: bash scripts/nightly-or-reuse.sh

      - name: Save updated OpenWrt caches
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            nightly-work/dl
            nightly-work/ccache
          key: flint3-build-cache-${{ runner.os }}-${{ github.run_id }}

      - name: Stop when no build or reusable release exists
        if: steps.nightly-build.outcome != 'success'
        run: exit 1

      - name: Publish exactly two firmware assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source nightly-release.env

          test -f "$FACTORY_FILE"
          test -f "$SYSUPGRADE_FILE"
          test "$(find release -maxdepth 1 -type f -name '*.bin' | wc -l)" -eq 2

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --prerelease

            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --prerelease
          fi

          gh release upload "$RELEASE_TAG" \
            "$FACTORY_FILE" \
            "$SYSUPGRADE_FILE" \
            --clobber

          asset_count="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')"
          test "$asset_count" -eq 2

          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort > /tmp/release-assets
          printf '%s\n' \
            "$(basename "$FACTORY_FILE")" \
            "$(basename "$SYSUPGRADE_FILE")" | sort > /tmp/expected-assets
          diff -u /tmp/expected-assets /tmp/release-assets
