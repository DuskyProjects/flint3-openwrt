name: Build Percival Flint 3 firmware

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: flint3-percival-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out builder
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo docker image prune --all --force || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3 python3-setuptools python3-pyelftools \
            rsync swig unzip zlib1g-dev file wget libelf-dev dwarves \
            ccache coccinelle zstd

      - name: Validate scripts
        run: |
          bash -n scripts/build.sh scripts/prepare-backports.sh

      - name: Build firmware
        env:
          JOBS: "4"
        run: |
          set -o pipefail
          bash scripts/build.sh 2>&1 | tee build.log

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flint3-percival-firmware
          path: |
            release/flint3-full-factory.bin
            release/flint3-sysupgrade.bin
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flint3-percival-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 14
